user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 8m; # matches the 4 MB image upload limit with headroom

    server {
        listen 80 default_server;
        root /var/www/html/public;
        index index.php;

        # Behind Dokploy's proxy — honour the forwarded scheme.
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        }

        # Long-cache the hashed Vite assets.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
